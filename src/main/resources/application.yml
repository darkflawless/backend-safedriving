
server:
  port: 8080

spring:
  application:
    name: driver-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/db_driver_management
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # update: tự tạo/cập nhật bảng theo entity khi khởi động (phù hợp môi trường dev local)
      # đổi thành "validate" hoặc "none" khi lên môi trường thật + dùng migration tool (Flyway/Liquibase)
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    default-property-inclusion: non_null

logging:
  level:
    com.safedriving: DEBUG
    org.hibernate.SQL: DEBUG

# Cấu hình JWT (đổi secret khi deploy thật, không commit secret thật lên git)
app:
  jwt:
    secret: "CHANGE_THIS_SECRET_KEY_TO_SOMETHING_LONG_AND_RANDOM_BEFORE_PRODUCTION_0123456789"
    expiration-ms: 86400000 # 24h

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# Cấu hình kết nối FastAPI Nhận diện khuôn mặt
face-recognition:
  base-url: http://localhost:8000